<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>whatever.monster</title>
  <meta name="description" content="whatever.monster — nothing to hide." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ HERO: the glass back ============ -->
  <section id="hero" aria-label="whatever.monster">
    <div class="stage">
      <div class="chassis">

        <!-- what's behind the glass (generated in main.js) -->
        <div class="internals" aria-hidden="true">
          <canvas class="layer"></canvas>
          <canvas class="layer"></canvas>
          <canvas class="layer"></canvas>
          <div class="shade"></div>
        </div>

        <!-- glyph light strips that sit on the glass -->
        <svg class="glyphs" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <circle class="glyph g1 ring" cx="1330" cy="330" r="196" pathLength="100" />
          <circle class="glyph ring r2" cx="1330" cy="330" r="196" pathLength="100" />
          <circle class="glyph ring r3" cx="1330" cy="330" r="196" pathLength="100" />
          <circle class="glyph ring r4" cx="1330" cy="330" r="196" pathLength="100" />
          <line class="glyph g2" x1="1068" y1="640" x2="1128" y2="580" />
          <line class="glyph g3" x1="1190" y1="882" x2="1480" y2="882" />
          <line class="glyph g4" x1="84" y1="270" x2="84" y2="470" />
          <circle class="glyph-dot" cx="1514" cy="882" r="7" />
        </svg>

        <!-- the glass itself -->
        <div class="glass" aria-hidden="true">
          <span class="screw tl"></span><span class="screw tr"></span>
          <span class="screw bl"></span><span class="screw br"></span>
        </div>

        <!-- black rim around the glass; scales outward as you scroll -->
        <div class="frame" aria-hidden="true"></div>

        <nav class="nav">
          <a class="logo" href="#hero" data-peek>whatever<span class="dot">.</span>monster</a>
          <div class="links">
            <a href="#services" data-peek>./services</a>
            <a href="#about" data-peek>./about</a>
            <a href="#work" data-peek>./work</a>
            <a class="cta" href="#contact" data-peek>hire_us()</a>
          </div>
        </nav>

        <div class="plate">
          <p class="kicker"><span class="t-com">// est. 2026 — you're looking at the inside</span></p>
          <h1 class="brand" data-peek>whatever<span class="dot">.</span>monster</h1>
          <p class="sub"><span class="t-kw">const</span> <span class="t-var">secrets</span> <span class="t-punc">=</span> <span class="t-kw">null</span><span class="t-punc">;</span></p>
        </div>

        <div class="hint" aria-hidden="true"><span class="t-fn">scroll</span><span class="t-punc">()</span> <span class="arrow">↓</span></div>

      </div>
    </div>
  </section>

  <!-- ============ NEXT: placeholder until we design it ============ -->
  <section id="services" class="next">
    <div class="next-inner">
      <p class="t-com">// 02 — services</p>
      <h2><span class="t-kw">export</span> <span class="t-kw">const</span> <span class="t-var">next</span> <span class="t-punc">=</span> <span class="t-str">"coming soon"</span><span class="t-punc">;</span></h2>
      <p class="t-com">// TODO: services · about · work · hire us · contact</p>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
